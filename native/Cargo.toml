[package]
name = "herdr-engine"
version = "1.3.0"
edition = "2021"
license = "MIT"

[dependencies]
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled", "serde_json"] }
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
dirs = "6"
fs2 = "0.4"
anyhow = "1"
regex = "1"
wait-timeout = "0.2"
clap = { version = "4", features = ["derive"] }
