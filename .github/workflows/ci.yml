name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows native app and CLI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: cargo clippy --locked --all-targets --manifest-path native/Cargo.toml
      - run: cargo clippy --locked --all-targets --release --manifest-path desktop/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: herdr-bot-windows-x64
          path: desktop/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

  macos:
    name: macOS native app and CLI
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build -- --bundles app
      - run: cargo clippy --locked --all-targets --manifest-path native/Cargo.toml
      - run: cargo clippy --locked --all-targets --release --manifest-path desktop/Cargo.toml
