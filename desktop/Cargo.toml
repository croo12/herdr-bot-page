[package]
name = "herdr-bot"
version = "1.3.0"
edition = "2021"
license = "MIT"
default-run = "herdr-bot"

[lints.clippy]
min_ident_chars = "deny"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
herdr-engine = { path = "../native" }
tauri = { version = "2", features = [] }
serde_json = "1"
rfd = "0.15"
open = "5"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
mime_guess = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]
